  </head>  <body>
    <div id="root">
      <!-- Loading spinner while React loads -->
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #0a0a0a;">
        <div style="width: 40px; height: 40px; border: 3px solid rgba(139, 195, 74, 0.3); border-top: 3px solid #8bc34a; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      </div>
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>

    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Simple performance monitoring -->
    <script>
      // Log performance metrics for optimization
      window.addEventListener('load', () => {
        setTimeout(() => {
          const perfData = performance.getEntriesByType('navigation')[0];
          console.log('Page Load Time:', perfData.loadEventEnd - perfData.fetchStart, 'ms');
        }, 0);
      });
    </script>
